<text x="600" y="89" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="300" fill="#ffffff" fill-opacity="0.55">Administrador: Windows PowerShell</text>
<text x="96" y="148" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#39c088" fill-opacity="0.85" xml:space="preserve">PS C:\&gt; </text>
<text x="188.0" y="148" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#ffffff" fill-opacity="0.85" xml:space="preserve">Get-ADUser -Filter {Enabled -eq $false} -Properties LastLogonDate `</text>
<text x="96" y="174" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#39c088" fill-opacity="0.85" xml:space="preserve">&gt;&gt;       </text>
<text x="199.5" y="174" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#ffffff" fill-opacity="0.85" xml:space="preserve">| Select-Object Name, SamAccountName, LastLogonDate</text>
<text x="96" y="200" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#8f93a8" fill-opacity="0.85" xml:space="preserve"></text>
<text x="96" y="226" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#8f93a8" fill-opacity="0.85" xml:space="preserve">Name               SamAccountName    LastLogonDate</text>
