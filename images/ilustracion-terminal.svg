<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Consola de administración de Active Directory mostrando la búsqueda de cuentas de usuario deshabilitadas y sin uso reciente">
<title>Consola de administración de Active Directory mostrando la búsqueda de cuentas de usuario deshabilitadas y sin uso reciente</title>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#23242f"/><stop offset="1" stop-color="#14151d"/></linearGradient>
<marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" fill-opacity="0.5"/></marker>
<pattern id="malla" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/></pattern>
<radialGradient id="brillo"><stop offset="0" stop-color="#5480f1" stop-opacity="0.22"/><stop offset="1" stop-color="#5480f1" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="520" fill="url(#fondo)"/>
<rect width="1200" height="520" fill="url(#malla)"/>
<ellipse cx="864" cy="104" rx="540" ry="286" fill="url(#brillo)"/>
<rect x="60" y="60" width="1080" height="440" rx="8" fill="#0f1017" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
<path d="M 60 68 a 8 8 0 0 1 8 -8 L 1132 60 a 8 8 0 0 1 8 8 L 1140 104 L 60 104 Z" fill="#ffffff" fill-opacity="0.06"/>
<circle cx="92" cy="82" r="7" fill="#e44c65" fill-opacity="0.85"/>
<circle cx="118" cy="82" r="7" fill="#e0a34a" fill-opacity="0.85"/>
