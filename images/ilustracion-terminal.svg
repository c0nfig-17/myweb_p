<text x="96" y="382" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#8f93a8" fill-opacity="0.85" xml:space="preserve"></text>
<text x="96" y="408" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#39c088" fill-opacity="0.85" xml:space="preserve">PS C:\&gt; </text>
<text x="188.0" y="408" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#e0a34a" fill-opacity="0.85" xml:space="preserve"># 47 cuentas activas sin uso en más de 12 meses.</text>
<text x="96" y="434" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#39c088" fill-opacity="0.85" xml:space="preserve">PS C:\&gt; </text>
<text x="188.0" y="434" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#e0a34a" fill-opacity="0.85" xml:space="preserve"># Cada una es una puerta abierta que nadie vigila.</text>
<text x="96" y="460" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="400" fill="#39c088" fill-opacity="0.85" xml:space="preserve">PS C:\&gt; </text>
