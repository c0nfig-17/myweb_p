<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Ciclo de desarrollo de software a medida">
<title>Ciclo de desarrollo de software a medida</title>
<defs>
