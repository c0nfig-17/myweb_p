<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Recorrido de una incidencia de soporte, desde el aviso del usuario hasta el informe de cierre">
<title>Recorrido de una incidencia de soporte, desde el aviso del usuario hasta el informe de cierre</title>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#23242f"/><stop offset="1" stop-color="#14151d"/></linearGradient>
<marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" fill-opacity="0.5"/></marker>
<pattern id="malla" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/></pattern>
<radialGradient id="brillo"><stop offset="0" stop-color="#5480f1" stop-opacity="0.22"/><stop offset="1" stop-color="#5480f1" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="400" fill="url(#fondo)"/>
<rect width="1200" height="400" fill="url(#malla)"/>
<ellipse cx="864" cy="80" rx="540" ry="220" fill="url(#brillo)"/>
<text x="40" y="44" text-anchor="start" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff" fill-opacity="0.38" letter-spacing="2">QUÉ PASA CUANDO NOS LLAMAS</text>
<rect x="60" y="140" width="196" height="150" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#e44c65" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="60" y="140" width="196" height="4" rx="2" fill="#e44c65"/>
<circle cx="158.0" cy="118" r="20" fill="#1c1d26" stroke="#e44c65" stroke-width="2"/>
<text x="158.0" y="125" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#ffffff" fill-opacity="0.9">1</text>
<text x="158.0" y="196" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.92">Nos avisas</text>
<text x="158.0" y="228" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">Teléfono, correo</text>
<text x="158.0" y="250" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">o portal</text>
<line x1="260" y1="215" x2="282" y2="215" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6" marker-end="url(#flecha)"/>
<rect x="288" y="140" width="196" height="150" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#e44c65" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="288" y="140" width="196" height="4" rx="2" fill="#e44c65"/>
<circle cx="386.0" cy="118" r="20" fill="#1c1d26" stroke="#e44c65" stroke-width="2"/>
<text x="386.0" y="125" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#ffffff" fill-opacity="0.9">2</text>
<text x="386.0" y="196" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.92">Registro</text>
<text x="386.0" y="228" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">Se abre el parte</text>
<text x="386.0" y="250" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">y se prioriza</text>
<line x1="488" y1="215" x2="510" y2="215" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6" marker-end="url(#flecha)"/>
<rect x="516" y="140" width="196" height="150" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#e0a34a" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="516" y="140" width="196" height="4" rx="2" fill="#e0a34a"/>
<circle cx="614.0" cy="118" r="20" fill="#1c1d26" stroke="#e0a34a" stroke-width="2"/>
<text x="614.0" y="125" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#ffffff" fill-opacity="0.9">3</text>
<text x="614.0" y="196" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.92">Diagnóstico</text>
<text x="614.0" y="228" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">En remoto en</text>
<text x="614.0" y="250" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">minutos</text>
<line x1="716" y1="215" x2="738" y2="215" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6" marker-end="url(#flecha)"/>
<rect x="744" y="140" width="196" height="150" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#39c088" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="744" y="140" width="196" height="4" rx="2" fill="#39c088"/>
<circle cx="842.0" cy="118" r="20" fill="#1c1d26" stroke="#39c088" stroke-width="2"/>
<text x="842.0" y="125" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#ffffff" fill-opacity="0.9">4</text>
<text x="842.0" y="196" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.92">Resolución</text>
<text x="842.0" y="228" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">Remoto o visita</text>
<text x="842.0" y="250" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">presencial</text>
<line x1="944" y1="215" x2="966" y2="215" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6" marker-end="url(#flecha)"/>
<rect x="972" y="140" width="196" height="150" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#39c088" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="972" y="140" width="196" height="4" rx="2" fill="#39c088"/>
<circle cx="1070.0" cy="118" r="20" fill="#1c1d26" stroke="#39c088" stroke-width="2"/>
<text x="1070.0" y="125" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#ffffff" fill-opacity="0.9">5</text>
<text x="1070.0" y="196" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.92">Cierre</text>
<text x="1070.0" y="228" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">Te contamos qué</text>
<text x="1070.0" y="250" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="300" fill="#ffffff" fill-opacity="0.5">pasó y por qué</text>
<line x1="60" y1="336" x2="1140" y2="336" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
<text x="60" y="372" text-anchor="start" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="300" fill="#ffffff" fill-opacity="0.55">Tiempos de respuesta acordados por contrato</text>
<text x="1140" y="372" text-anchor="end" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="300" fill="#ffffff" fill-opacity="0.55">Informe mensual de todo lo ocurrido</text>
</svg>
